name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python setup_database.py
      - run: python test_queries.py
      - name: Smoke-test web app and API
        run: |
          python run.py >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:8000"
          checks = {
              "/": lambda response: response.headers.get_content_type() == "text/html",
              "/docs": lambda response: response.headers.get_content_type() == "text/html",
              "/api/jobs": lambda response: json.load(response)["total"] > 0,
          }

          for path, validate in checks.items():
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(base_url + path, timeout=2) as response:
                          assert response.status == 200
                          assert validate(response), f"Unexpected response from {path}"
                      break
                  except (OSError, urllib.error.URLError):
                      if attempt == 29:
                          raise
                      time.sleep(1)

          print("Web app, API docs, and jobs API smoke tests passed.")
          PY
