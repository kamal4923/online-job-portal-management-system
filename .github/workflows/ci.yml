name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python setup_database.py
      - run: python test_queries.py
      - name: Smoke-test web app and API
        run: |
          python run.py >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import json
          from pathlib import Path
          import time
          import urllib.error
          import urllib.request

          base_url = "http://127.0.0.1:8000"
          checks = {
              "/": lambda response: response.headers.get_content_type() == "text/html",
              "/docs": lambda response: response.headers.get_content_type() == "text/html",
          }

          for path, validate in checks.items():
              for attempt in range(30):
                  try:
                      with urllib.request.urlopen(base_url + path, timeout=2) as response:
                          assert response.status == 200
                          assert validate(response), f"Unexpected response from {path}"
                      break
                  except (OSError, urllib.error.URLError):
                      if attempt == 29:
                          raise
                      time.sleep(1)

          def request_json(path, payload=None):
              body = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(
                  base_url + path,
                  data=body,
                  headers={"Content-Type": "application/json"},
                  method="GET" if payload is None else "POST",
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  assert response.status == 200
                  return json.load(response)

          jobs = request_json("/api/jobs")
          assert jobs["total"] >= 500 and len(jobs["jobs"]) >= 500, (
              f"Expected at least 500 jobs, got {jobs['total']}"
          )

          applicants = request_json("/api/recruiter/jobs/1/applicants")["applicants"]
          assert len(applicants) >= 2, "Expected seeded applicants for accept/reject checks"
          accept_id, reject_id = [applicant["application_id"] for applicant in applicants[:2]]

          accepted = request_json(
              f"/api/recruiter/applications/{accept_id}/accept",
              {
                  "remarks": "CI acceptance test",
                  "offered_ctc": 900000,
                  "joining_date": "2026-12-01",
                  "changed_by_user_id": 2,
              },
          )
          rejected = request_json(
              f"/api/recruiter/applications/{reject_id}/reject",
              {
                  "reason": "CI rejection test",
                  "remarks": "CI test feedback",
                  "changed_by_user_id": 2,
              },
          )
          assert accepted["status"] == "accepted"
          assert rejected["status"] == "rejected"

          updated_applicants = request_json(
              "/api/recruiter/jobs/1/applicants"
          )["applicants"]
          statuses = {
              applicant["application_id"]: applicant["current_status"]
              for applicant in updated_applicants
          }
          assert statuses[accept_id] == "accepted"
          assert statuses[reject_id] == "rejected"

          frontend = Path("index.html").read_text(encoding="utf-8")
          for feature in (
              'id="view-recruiter-accept-application"',
              'id="view-recruiter-reject-application"',
              "openAcceptApplicationPage",
              "openRejectApplicationPage",
              "const JOBS_PER_PAGE = 24",
          ):
              assert feature in frontend, f"Missing frontend feature: {feature}"

          print("Web app, API docs, 500 jobs, dedicated action pages, and accept/reject API checks passed.")
          PY
